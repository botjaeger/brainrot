name: CI

# Gates pull requests and pushes to branches other than main: ESLint, typecheck, tests, the
# extension builds, the Playwright end-to-end tests and the website build. Pushes to main are gated by site.yml before it deploys.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        run: pnpm check

      - name: Build extension
        run: pnpm build

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Build site
        run: pnpm build:site
