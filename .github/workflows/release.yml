name: Release

# Runs when `pnpm release <version>` pushes a v<version> tag.
# One gate job builds the packages; Chrome, Firefox and the GitHub release then
# run as separate jobs, so one store's rejection never blocks the other. A
# failed store job can be re-run alone from the Actions page.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version" >&2
            exit 1
          fi

      - name: Typecheck and test
        run: pnpm check

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Build store packages
        run: |
          pnpm build
          node scripts/zip-chrome.mjs
          node scripts/zip-firefox.mjs
          # AMO reviewers rebuild from this archive (see SOURCE_BUILD.md).
          git archive --format=zip -o brainrot-source.zip HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            brainrot-chrome.zip
            brainrot-firefox.zip
            brainrot-source.zip
          if-no-files-found: error

  chrome:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Chrome Web Store API (https://github.com/fregante/chrome-webstore-upload-keys)
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - name: Warn about missing secrets
        if: env.EXTENSION_ID == '' || env.REFRESH_TOKEN == ''
        run: echo "::warning::Chrome Web Store secrets not set; Chrome was NOT published"

      - uses: actions/download-artifact@v8
        if: env.EXTENSION_ID != '' && env.REFRESH_TOKEN != ''
        with:
          name: packages

      - uses: actions/setup-node@v7
        if: env.EXTENSION_ID != '' && env.REFRESH_TOKEN != ''
        with:
          node-version: 22

      - name: Publish to Chrome Web Store
        if: env.EXTENSION_ID != '' && env.REFRESH_TOKEN != ''
        run: npx --yes chrome-webstore-upload-cli@4 --source brainrot-chrome.zip

  firefox:
    needs: build
    runs-on: ubuntu-latest
    env:
      # addons.mozilla.org API key (https://addons.mozilla.org/developers/addon/api/key/)
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Warn about missing secrets
        if: env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == ''
        run: echo "::warning::AMO secrets not set; Firefox was NOT published"

      - uses: actions/download-artifact@v8
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          name: packages

      - uses: actions/setup-node@v7
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        with:
          node-version: 22

      - name: Publish to Firefox Add-ons
        if: env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: |
          unzip -q brainrot-firefox.zip -d firefox
          npx --yes web-ext@10.5.0 sign \
            --source-dir firefox \
            --channel listed \
            --upload-source-code brainrot-source.zip \
            --approval-timeout 0

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          brainrot-chrome.zip brainrot-firefox.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
