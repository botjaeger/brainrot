name: Site

# Every push to main runs the gate (typecheck, tests, site build). Only when it
# is green does the deploy job publish the website to GitHub Pages, served from
# the public botjaeger/brainrot-site repo (this repo is private).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Build site
        run: pnpm exec vite build -c vite.site.config.ts --base /brainrot-site/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site
          retention-days: 1

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      # Write deploy key for botjaeger/brainrot-site (private half).
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
    steps:
      - name: Require the deploy key
        if: env.SITE_DEPLOY_KEY == ''
        run: |
          echo "::error::SITE_DEPLOY_KEY is not set; the site was NOT deployed"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to botjaeger/brainrot-site
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:botjaeger/brainrot-site.git out
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R site/. out/
          find out -name '*.map' -delete
          touch out/.nojekyll

          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to deploy."
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push origin HEAD:main
