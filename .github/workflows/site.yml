name: Site

# Every push to main runs the gate (typecheck, tests, site build). Only when it
# is green does the deploy job publish the website to this repo's GitHub Pages
# (https://botjaeger.github.io/brainrot/). Pages source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Build site
        run: |
          pnpm --filter brainrot-site exec vite build --base /brainrot/
          find site/dist -name '*.map' -delete

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
