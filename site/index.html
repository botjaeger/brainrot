<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brainrot — Just watch. No swipes.</title>
    <!-- FOUC PREVENTION: plain inline script, must appear BEFORE link rel="stylesheet" -->
    <script>
      (function() {
        var saved = localStorage.getItem("theme");
        var prefers = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefers ? "dark" : "light")
        );
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <img class="logo-mascot" src="/mascot.png" alt="" />
          <span>Brainrot</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <!-- Sun icon (visible in light mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (visible in dark mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </header>

      <!-- Hero Section -->
      <section class="hero">
        <img class="hero-image" src="/headliner.png" alt="" />
        <h1 class="hero-headline">Just watch. No swipes.</h1>
        <p class="hero-subheadline">Auto-scroll YouTube Shorts, TikTok, Facebook Reels, and Instagram Reels — keeps playing even in the background.</p>

        <!-- CTA buttons (hidden on mobile, shown on desktop at >=1024px) -->
        <div class="cta-group" id="cta-group">
          <a class="cta-btn" data-cta-browser="chrome" aria-disabled="true" tabindex="-1">Chrome — Coming Soon</a>
          <a class="cta-btn" data-cta-browser="firefox" aria-disabled="true" tabindex="-1">Firefox — Coming Soon</a>
          <a class="cta-btn" data-cta-browser="safari" aria-disabled="true" tabindex="-1">Safari — Coming Soon</a>
        </div>

        <!-- Mobile redirect banner (shown on mobile, hidden on desktop) -->
        <div class="mobile-redirect-banner" role="status">
          Brainrot is a browser extension — visit on your desktop to install.
        </div>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
