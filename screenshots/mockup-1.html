<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 800px;
    background: #0f0f0f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .layout {
    display: flex;
    align-items: center;
    gap: 80px;
  }

  /* Popup card */
  .popup {
    width: 400px;
    background: #121212;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 4px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 800;
    color: #f0f0f0;
    letter-spacing: -0.03em;
  }

  .logo img {
    width: 56px;
    height: 56px;
  }

  .version {
    font-size: 11px;
    font-weight: 500;
    color: #949494;
    margin-left: 4px;
    margin-top: 4px;
  }

  .theme-icon {
    color: #949494;
    font-size: 22px;
  }

  .hero {
    background: #ffc20a;
    border-radius: 32px;
    padding: 24px;
    margin-bottom: 32px;
    color: #1a1a1a;
    box-shadow: 0 0 30px rgba(255,194,10,0.3);
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .hero-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .hero-subtitle {
    margin: 4px 0 0;
    font-size: 14px;
    font-weight: 500;
    color: #3a2d00;
  }

  .switch {
    width: 64px;
    height: 36px;
    background: #1a1a1a;
    border-radius: 34px;
    position: relative;
  }

  .thumb {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #f0f0f0;
    border-radius: 50%;
    top: 4px;
    right: 4px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.1);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
  }

  .check {
    width: 16px;
    height: 16px;
    background: #1a1a1a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffc20a;
    font-size: 10px;
  }

  .stats-label {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #949494;
    padding: 4px;
  }

  /* Right side text */
  .promo {
    max-width: 420px;
    color: #f0f0f0;
  }

  .promo h1 {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .promo h1 span {
    color: #ffc20a;
  }

  .promo p {
    font-size: 20px;
    color: #949494;
    line-height: 1.5;
  }

  .sites {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .site-badge {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #f0f0f0;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="popup">
      <div class="header">
        <div class="logo">
          <img src="/mascot.png" alt="">
          <span>Brainrot</span>
          <span class="version">v0.1.0</span>
        </div>
        <span class="theme-icon">&#9788;</span>
      </div>
      <div class="hero">
        <div class="hero-top">
          <div>
            <div class="hero-title">Brainrot mode</div>
            <div class="hero-subtitle">No taps. No swipes. Just watch.</div>
          </div>
          <div class="switch"><div class="thumb"></div></div>
        </div>
        <div class="pill">
          <div class="check">&#10003;</div>
          <span>YouTube Shorts detected</span>
        </div>
      </div>
      <div class="stats-label">STATS &and;</div>
    </div>

    <div class="promo">
      <h1>Just watch.<br><span>No swipes.</span></h1>
      <p>Automatically advances to the next video when playback ends. Works on YouTube Shorts, TikTok, Facebook Reels, and Instagram Reels.</p>
      <div class="sites">
        <div class="site-badge">YouTube Shorts</div>
        <div class="site-badge">TikTok</div>
        <div class="site-badge">FB Reels</div>
        <div class="site-badge">IG Reels</div>
      </div>
    </div>
  </div>
</body>
</html>
